<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tag</title>
</head>
<body>
    <!-- border attribute adds a border around the table and between cells. Cell padding is used to change the space between the cell content and cell border. 
    Cell spacing is used to change the space between cells of table. -->
    <table border="5" cellpadding="10" cellspacing="0">
        <!-- <thead> tag is used under table tag to segregate the header of the table(Not necessary, good for Accessability, SEO optimization and Readability). -->
        <thead>
            <tr>
                <!-- <th> tag is used to give provide a bolder headings for each column of table. -->
                <th>Header 1</th>
                <th>Header 2</th>
            </tr>
        </thead>
        <!-- <tbody> tag defines the main body of the table containing actual data(Not necessary, good for Accessability, SEO optimization and Readability).  -->
        <tbody>
            <!-- tr is the table row tag used to create rows of the table -->
            <tr>
                <!-- td is the table data tag used to enter data in the rows of table -->
                <td>Row 1, Cell 1</td>
                <td>Row 1, Cell 2</td>
            </tr>
            <tr>
                <td>Row 2, Cell 1</td>
                <td>Row 2, Cell 2</td>
            </tr>
            <tr>
                <td>Row 3, Cell 1</td>
                <td>Row 3, Cell 2</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
