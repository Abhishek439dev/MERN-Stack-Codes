<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
  <!-- MARQUEE TAG IS DEPRECEATED AND ITS USE IS HIGHLY DISCOURAGED. THIS IS FOR INFORMATION PURPOSE.  -->
  <!-- Marquee tag is used to create scrolling text content moving from one side to another on the web page, now this functionality should be achieved using CSS. -->
<body>
    <!-- This tag has two attributes, the behaviour defines its movement on the page and direction defines the starting point. 
    behaviour can be scroll(default), slide and alternate while direction can be left, right, up and down. -->
    <marquee behavior="scroll" direction="left">This is a simple marquee example.</marquee>
    <marquee behavior="slide" direction="left">This is a simple marquee example.</marquee>
    <marquee behavior="alternate" direction="left">This is a simple marquee example.</marquee>
</body>
</html>
