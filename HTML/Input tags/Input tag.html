<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- In this program, we will see the different types of inputs we can create using the input tag. -->
  
  <!-- type determines the input type. 
  'name' attribute is the key for the data submitted to server with a pre-defined value or a value entered by user.
  'placeholder' attribute is used to hint the user for entering an input
  'required' attribute makes it necessary to enter an input in that field.
  'maxlength' attribute determines the maximum number of characters that can be entered in the text input field.
  'autofocus' attribute is used to focus/highlight on a particular input field having this attribute when the page loads.
  'size' attribute determines the width of the input field in terms of number of characters.
  'min' and 'max' attributes in number type field determines the minimum and maximum possible user input respectively -->
  
    <input type="text" name="Name" placeholder="Enter your name" required maxlength="50" autofocus size="50"> <br> <!-- text input field -->
    <input type="number" name="Age" placeholder="Age" min="1" max="100" > <br> <!-- Numbers input field -->
    <input type="color" name="FavoriteColor"> <br> <!-- Color selection input -->
    <input type="date" name="DateOfBirth"> <br> <!--Date of birth input field -->
    <input type="datetime"> <br>  <!-- Plain text input field for date and time -->
    <input type="datetime-local"> <br>  <!-- Date and time input field -->
    <input type="file"> <br>  <!-- File selector input field -->

    <!-- In checkboxes and radio buttons we have to provide name and value attributes because when they are selected, the data needs to be send to server so there 
    should be a value associated with each checkbox or radio button.  -->
    <!-- checkbox type input -->
    <input type="checkbox" name="hobbies" value="Reading"> Reading <br>
    <input type="checkbox" name="hobbies" value="Traveling"> Traveling <br>

    <!-- Radio buttons type input -->
    <input type="radio" name="gender" value="Male"> Male <br>
    <input type="radio" name="gender" value="Female"> Female <br>
    <input type="radio" name="gender" value="other"> Other <br>

    <label for="adult">Are you an adult?</label> <br>
    <input type="radio" name="Adult" value="Yes"> Yes <br>
    <input type="radio" name="Adult" value="No"> No <br>

    <!-- In dropdown menu we define the name in the select tag and the value attributes is defined for each of the option of menu.
    The 'selected' attribute pre-selects the option from menu when the page loads, which can be changed by the user and the 'disabled' attribute greys out the 
    option such that it can't be selected by the user.  -->
    <!-- Dropdown menu type input -->
    <select name="state">
        <option selected disabled>Select State</option>
        <option value="Rajasthan">Rajasthan</option>
        <option value="Gujarat">Gujarat</option>
        <option value="Madhya Pradesh">Madhya Pradesh</option>
        <option value="Uttarakhand">Uttarakhand</option>
        <option value="Uttar Pradesh">Uttar Pradesh</option>
        <option value="Maharashtra">Maharashtra</option>    
    </select>
    <br>

    <!-- textarea type input : It is used to create an input area for larger textual inputs like comments, reviews, feedbacks etc. The 'rows' and 'cols' 
    attribute defines an initial default size of the text-area but the text area is resizable which can be disabled via CSS resize property.-->
    <textarea name="comment" placeholder="Enter your comment" rows="5" cols="20"></textarea>
    <br>

    <!-- input tag with submit type converts to a button -->
    <input type="submit" value="Submit"> <br>
</body>
</html>
