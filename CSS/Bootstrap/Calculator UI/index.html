<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">


</head>
<body>
    <!-- this is the outer div which contains the complete UI. It is styled to place all the items in center of screen. -->
    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100" style="width: 250px;">
        <h2>Calculator</h2>

        <!-- It is an input field which mimics a field which shows the calculations and outputs. the 'dir' attribute defines the direction of content (rtl = right to left)
        the form-control class styles this input field as per bootstrap. -->
        <input type="text" dir="rtl" class="w-100 my-4 p-2 form-control">

        <!-- Creating multiple rows containing the buttons of calculator. my = margin at y-axis. gx = horizontal gutter space. w =  width. -->
        <div class="row my-2 gx-5 w-100">
            <div class="col">
                <button type="button" class="btn-solid theme-light">7</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">8</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">9</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">+</button>
            </div>
        </div>
        <div class="row my-2 gx-5 w-100">
            <div class="col">
                <button type="button" class="btn-solid theme-light">4</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">5</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">6</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">-</button>
            </div>
        </div>
        <div class="row my-2 gx-5 w-100">
            <div class="col">
                <button type="button" class="btn-solid theme-light">1</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">2</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">3</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">x</button>
            </div>
        </div>
        <div class="row my-2 gx-5 w-100">
            <div class="col">
                <button type="button" class="btn-solid theme-light">0</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">^</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">%</button>
            </div>
            <div class="col">
                <button type="button" class="btn-solid theme-light">/</button>
            </div>
        </div>
         <div class="row my-2 gx-5 w-100">
            <div class="col-9">
                <button type="button" class="btn-solid theme-primary w-100">=</button>
            </div>
            <div class="col-3">
                <button type="button" class="btn-solid theme-warning ">C</button>
            </div>
        </div>



    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
