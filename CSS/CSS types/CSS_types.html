<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: blue;
            background-color: lightgray;
            font-size: 20px;
            padding: 15px;
        }
    </style>
    <link rel="stylesheet" href="externalCSS.css">
</head>
<body>
    <h1 style="color:yellow; font-style: italic;">Inline CSS</h1>

    <p>This is a paragraph and we have styled it using internal CSS. This is done under the style tag in the head section of the HTML document.</p>
</body>
</html>
